# ============================================================
# 06-gateway.yaml — API 网关
#
# 教学点：
# 1. 网关也只配 k8s Service DNS 路由（不需要注册中心）
# 2. 网关双副本 + Ingress 负载均衡（见 07-ingress.yaml）
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: k8s-demo
data:
  SERVER_PORT: "8082"
  USER_SERVICE_URL: "http://user-service:8080"
  ORDER_SERVICE_URL: "http://order-service:8081"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: k8s-demo
spec:
  selector:
    app: gateway
  ports:
    - port: 8082
      targetPort: 8082

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: k8s-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: skywalking-agent
          image: apache/skywalking-java-agent:9.2.0
          command: ["sh", "-c", "cp -r /skywalking/agent /agent-volume/"]
          volumeMounts:
            - name: skywalking-agent
              mountPath: /agent-volume
      containers:
        - name: gateway
          image: localhost:5000/k8s-demo/gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/skywalking-agent/skywalking-agent.jar"
            - name: SW_AGENT_NAME
              value: gateway
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: skywalking-oap:11800
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 25"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking-agent
      volumes:
        - name: skywalking-agent
          emptyDir: {}
