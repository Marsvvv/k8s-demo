# ============================================================
# 11-skywalking.yaml — APM 链路追踪（OAP 服务端 + UI）
#
# 教学点：
# 1. 业务 Pod 里的 java agent（04/05/06 的 initContainer 注入）
#    通过 gRPC 11800 把调用链上报到本文件部署的 OAP
# 2. 存储用 H2（演示够用，重启即丢）；真实线上用 Elasticsearch
# 3. UI 通过 Ingress 访问：http://skywalking.local
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: skywalking-oap
  namespace: k8s-demo
spec:
  selector:
    app: skywalking-oap
  ports:
    - name: grpc
      port: 11800
      targetPort: 11800
    - name: http
      port: 12800
      targetPort: 12800

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-oap
  namespace: k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-oap
  template:
    metadata:
      labels:
        app: skywalking-oap
    spec:
      containers:
        - name: oap
          image: apache/skywalking-oap-server:9.2.0
          env:
            - name: SW_STORAGE
              value: h2
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
          ports:
            - containerPort: 11800
            - containerPort: 12800
          readinessProbe:
            tcpSocket:
              port: 12800
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 12800
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi

---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-ui
  namespace: k8s-demo
spec:
  selector:
    app: skywalking-ui
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-ui
  namespace: k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-ui
  template:
    metadata:
      labels:
        app: skywalking-ui
    spec:
      containers:
        - name: ui
          image: apache/skywalking-ui:9.2.0
          env:
            - name: SW_OAP_ADDRESS
              value: http://skywalking-oap:12800
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
