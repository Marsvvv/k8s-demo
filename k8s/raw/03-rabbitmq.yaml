# ============================================================
# 03-rabbitmq.yaml — RabbitMQ 用 Deployment + 预建 PVC 部署
#
# 教学点：有状态应用的另一种流派——
# 不像 MySQL 用 StatefulSet + 动态 PVC，这里用 Deployment + 手动声明 PVC。
# 适合单实例、不需要稳定网络标识的中间件。
# ============================================================

# --- 预建 PVC（与 MySQL 的 volumeClaimTemplates 动态创建对比） ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: k8s-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: k8s-demo
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management   # 带 Web 管理界面（15672）
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq   # 队列持久化目录，落到 PVC
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
