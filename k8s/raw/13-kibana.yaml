# ============================================================
# 13-kibana.yaml — ES 的可视化界面（日志检索、Dashboard）
#
# 教学点：
# 1. Kibana 连 ES 只配一个地址，服务发现交给 k8s DNS
# 2. I18N_LOCALE=zh-CN：官方中文界面
# 3. 通过 Ingress 对外：http://kibana.local（hosts 记得加一行）
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: k8s-demo
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:7.17.16
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: I18N_LOCALE
              value: zh-CN
          ports:
            - containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  namespace: k8s-demo
spec:
  ingressClassName: nginx
  rules:
    - host: kibana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
